name: Export GitHub Project

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  export-project:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.PROJECT_READ_TOKEN }}
      PROJECT_OWNER: "@me"
      PROJECT_NUMBER: "3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Export project snapshot
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p project-snapshot

          echo "Exporting project metadata..."
          gh project view "$PROJECT_NUMBER" \
            --owner "$PROJECT_OWNER" \
            --format json \
            > project-snapshot/project.json

          echo "Exporting project fields..."
          gh project field-list "$PROJECT_NUMBER" \
            --owner "$PROJECT_OWNER" \
            --limit 100 \
            --format json \
            > project-snapshot/fields.json

          echo "Exporting project items..."
          gh project item-list "$PROJECT_NUMBER" \
            --owner "$PROJECT_OWNER" \
            --limit 1000 \
            --format json \
            > project-snapshot/items.json

          echo "Export finished."

          echo "Snapshot contents:"
          ls -lah project-snapshot/

      - name: Commit updated snapshot
        shell: bash
        run: |
          set -euo pipefail

          git add project-snapshot/

          if git diff --cached --quiet; then
            echo "Project snapshot has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: update GitHub Project snapshot"
          git push
